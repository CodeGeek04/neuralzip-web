<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Neuralzip: neural compression, every byte back</title>
  <desc>A 3.12 MB text file becomes a visibly smaller 791 KB .nzip archive. A measured five-book research example, including model weights, with exact original bytes restored.</desc>
  <rect width="1200" height="630" fill="#f6f7fa"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="64" y="58" width="46" height="46" rx="11" fill="#c5482b"/>
    <path d="M78 66h13l8 8v24H78zM91 66v10h8M84 83h9M84 89h7" fill="none" stroke="#f6f7fa" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="125" y="93" fill="#232832" font-size="36" font-weight="700" letter-spacing="-1.2">Neuralzip</text>
    <text x="1136" y="87" text-anchor="end" fill="#606673" font-size="19" font-weight="600" letter-spacing="1.8">100% LOSSLESS</text>
    <text x="64" y="192" fill="#232832" font-size="68" font-weight="700" letter-spacing="-2.6">Neural compression.</text>
    <text x="67" y="241" fill="#606673" font-size="33" letter-spacing="-.7">Every byte back.</text>

    <!-- The original file is deliberately larger than the complete archive. -->
    <path d="M154 281h108l52 52v112H154z" fill="#ebedf2" stroke="#5c6472" stroke-width="3" stroke-linejoin="round"/>
    <path d="M262 281v52h52M179 349h81M179 365h60" fill="none" stroke="#5c6472" stroke-width="3" stroke-linejoin="round"/>
    <text x="234" y="419" text-anchor="middle" fill="#232832" font-size="36" font-weight="600">.txt</text>

    <text x="610" y="330" text-anchor="middle" fill="#c5482b" font-size="31" font-weight="700" letter-spacing="-.8">3.94× smaller</text>
    <path d="M413 359h371m-20-19 20 19-20 19" fill="none" stroke="#c5482b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="610" y="405" text-anchor="middle" fill="#606673" font-size="22">Model + stream included</text>

    <path d="M904 315h76l36 36v94H904z" fill="#c5482b" stroke="#c5482b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M980 315v36h36M922 370h47" fill="none" stroke="#f6f7fa" stroke-width="3" stroke-linejoin="round"/>
    <text x="960" y="420" text-anchor="middle" fill="#f6f7fa" font-size="28" font-weight="600">.nzip</text>

    <text x="234" y="493" text-anchor="middle" fill="#232832" font-size="35" font-weight="700" letter-spacing="-1">3.12 MB</text>
    <text x="960" y="493" text-anchor="middle" fill="#c5482b" font-size="35" font-weight="700" letter-spacing="-1">791 KB</text>
    <text x="234" y="523" text-anchor="middle" fill="#606673" font-size="20">Original text</text>
    <text x="960" y="523" text-anchor="middle" fill="#606673" font-size="20">Complete archive</text>
    <text x="600" y="551" text-anchor="middle" fill="#606673" font-size="20">Five-book research example · Exact original bytes restored</text>
    <path d="M64 568h1072" stroke="#d8dce3" stroke-width="1.5"/>
    <text x="64" y="600" fill="#232832" font-size="19" font-weight="500">Open source · Runs in your browser</text>
    <text x="1136" y="600" text-anchor="end" fill="#606673" font-size="19">neuralzip-web.vercel.app</text>
  </g>
</svg>
